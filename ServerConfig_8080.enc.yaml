## CGIとして動作させるときのWebサーバを指定する。
## WebServer nginxSakura, Apache2Ubuntu or None
## NoneはこのプログラムをWebサーバとして動作させる。
## この設定はグラフを作るときSVGファイルをどこに置くかということに関係する。
## グラフを出力しないケースではどのような設定にしても問題ないでしょう。
WebServer: None
HTTPport: 8080
# HTTPport: 8000
# Cloudflare Turnstile設定
TurnstileSiteKey: ENC[AES256_GCM,data:AmzqpaT+troB0HfuCi9uvbj872HXI+NJ,iv:IRuLknFYcVUxVxi8hKEpZ7ZRy4Ouh+HLI2xRhCvYBTk=,tag:TXIUyUXc3T14Nd+JlOVagw==,type:str]
TurnstileSecretKey: ENC[AES256_GCM,data:XSPtDXNvwqoYL8G8OeCdSauA1qYcpSQhSJK1Ksr3HGwWNLc=,iv:hklII4VQIWLaTqEJndaGiiR8Il2qaWQrQ3abyTJcjTY=,tag:4b29j3jALKcr+6jxFyu7Qw==,type:str]
# Turnstileセッション管理
TurnstileUseSession: true # セッション機能の有効/無効
TurnstileSessionDuration: 57600 # セッション有効期間（秒）デフォルト1時間
TurnstileSessionMaxUses: 0 # セッション内の最大利用回数（0=無制限）
# SSLに関する設定は環境変数で渡す。
## CGIとして実行するときあるいはSSLを使用せずWebServerとして実行するときは設定しない。
## SSL証明書関連のファイルはふつうrootしか参照できない形でおかれているので
## その対策が必要です。
## 今は~/.letsencrypt にコピーしてきて使っていますが...
SSLcrt: null
SSLkey: null
# イベント一覧に表示するイベントの数（緊急対応でここに）
NoEvent: 30
# メンテナンスに際して機能を停止し、メンテナンス中であることを表示する
#Maintenance: true
#
# ボットの排除レベル
LvlBots: 3
# 時間枠のアクセス回数上限
AccessLimit: 3
# アクセス回数制限の時間枠(秒単位)
TimeWindow: 1
# IPアドレス暗号化キー
IPEncryptionKeyHex: ENC[AES256_GCM,data:9LhDB4ryZZy3mNe6MvABMXRFd84ezNxAe7cRQhOwm/IaKDTIrAyqyb9ppmip2GvV3sGngOMFQ/di1+SWzH1E5A==,iv:xJz6urkGcvblaTwcY76aWA8kJKrAUjRNepqn81VqOKk=,tag:KUhAjbqbEYgg5wiFGXA9cg==,type:str]
# IPアドレスによるアクセス制限を行うか？
DenyNonJP: false
# ユーザー情報登録のエンドポイント
GWURL: http://localhost:8888/
