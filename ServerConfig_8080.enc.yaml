## CGIとして動作させるときのWebサーバを指定する。
## WebServer nginxSakura, Apache2Ubuntu or None
## NoneはこのプログラムをWebサーバとして動作させる。
## この設定はグラフを作るときSVGファイルをどこに置くかということに関係する。
## グラフを出力しないケースではどのような設定にしても問題ないでしょう。
WebServer: None
HTTPport: 8080
# HTTPport: 8000
# Cloudflare Turnstile設定
TurnstileSiteKey: ENC[AES256_GCM,data:ioWJrt0to/tl8IWNJ041RdsbYPB8myf4,iv:Kp5v4H6gruJv4rX3Ybcajw1uRkay1AZCHsVUoOxdIyI=,tag:oTMTgchRLjag9BJUxxLuPg==,type:str]
TurnstileSecretKey: ENC[AES256_GCM,data:3Eh6H6JoQIGb1vbUYuqV6HRElTrAM9gCgRWrAY7fPLiN+Sk=,iv:c2oqCvj1DbooMftHk/JdRoi7xC9yWV7qaJaKQ7Fx8mw=,tag:8qIpVOMnWrASThtCGOJLnQ==,type:str]
# Turnstileセッション管理
TurnstileUseSession: true # セッション機能の有効/無効
TurnstileSessionDuration: 28800 # セッション有効期間（秒）デフォルト1時間
TurnstileSessionMaxUses: 0 # セッション内の最大利用回数（0=無制限）
# SSLに関する設定は環境変数で渡す。
## CGIとして実行するときあるいはSSLを使用せずWebServerとして実行するときは設定しない。
## SSL証明書関連のファイルはふつうrootしか参照できない形でおかれているので
## その対策が必要です。
## 今は~/.letsencrypt にコピーしてきて使っていますが...
SSLcrt: null
SSLkey: null
# イベント一覧に表示するイベントの数（緊急対応でここに）
NoEvent: 30
# メンテナンスに際して機能を停止し、メンテナンス中であることを表示する
#Maintenance: true
#
# ボットの排除レベル
LvlBots: 3
# 時間枠のアクセス回数上限
AccessLimit: 3
# アクセス回数制限の時間枠(秒単位)
TimeWindow: 1
# IPアドレス暗号化キー
IPEncryptionKeyHex: ENC[AES256_GCM,data:cICrbXfQyfw2kFt+Yr46mTNlMM3oNpk+3gEIT4CKG4h+K28OP45A1ArAGRUCWN8QPCfd1WsaMNPoooIx5aA0TA==,iv:3V0LtUnQMp+2P/8Y+cagSDntbol1eRJlFqKc7GYjplY=,tag:d0aJruwweiCxAIsLagE+OQ==,type:str]
# IPアドレスによるアクセス制限を行うか？
DenyNonJP: false
# ユーザー情報登録のエンドポイント
GWURL: http://localhost:8888/
